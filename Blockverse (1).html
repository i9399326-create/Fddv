<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blockverse</title>
<style>
:root{--bg:#eef0f8;--p:#fff;--t:#111426;--m:#5c6477;--l:#d9dde8;--a:#3b5bff;--c:#e3e6f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10122a;--p:#1a1d3d;--t:#fff;--m:#9aa3d0;--l:#2b2f5c;--a:#5b7cff;--c:#2a2e5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10122a;--p:#1a1d3d;--t:#fff;--m:#9aa3d0;--l:#2b2f5c;--a:#5b7cff;--c:#2a2e5e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg)}
.lg{display:flex;align-items:center;gap:6px;font-weight:900;letter-spacing:.5px;font-size:18px}.sp{flex:1}
.ib{position:relative;font-size:20px;padding:4px 6px}.bd{position:absolute;top:-2px;right:-2px;background:var(--a);color:#fff;font:700 10px/16px sans-serif;width:16px;height:16px;border-radius:50%;text-align:center}
.cur{font-weight:800;background:var(--c);border-radius:99px;padding:4px 10px}
main{padding:4px 14px 90px;max-width:720px;margin:0 auto}h3{margin:16px 0 8px;font-size:18px}
.who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.fr{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:10px 0}.f{flex:0 0 74px;text-align:center;font-size:12px}.f small{display:block;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc{position:relative;width:70px;height:70px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:4px}.fc i{position:absolute;right:2px;bottom:2px;width:14px;height:14px;border-radius:50%;background:#2fe6b4;border:2px solid var(--bg)}
.gd{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gt{text-align:left}.gt svg{width:100%;height:auto;border-radius:12px;display:block}.gt b{display:block;margin-top:5px;font-size:14px}.gt small{color:var(--m)}.gt.off{opacity:.45}
.nv{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--l)}
.nv button{flex:1;padding:8px 0;font-size:11px;font-weight:700;color:var(--m);display:flex;flex-direction:column;align-items:center}.nv b{font-size:21px}.nv .on{color:var(--t)}
.row{display:flex;align-items:center;gap:10px;background:var(--p);border-radius:12px;padding:10px;margin-bottom:8px}.row b.n{width:24px;color:var(--m)}.row svg{width:90px;border-radius:8px}
.sr{width:100%;padding:11px 14px;border-radius:99px;border:1px solid var(--l);background:var(--p);color:var(--t);font:inherit;margin:6px 0 10px}
#pv{height:36vh;min-height:230px;background:radial-gradient(circle at 50% 35%,#6a6fa8,#2b2d52);position:relative}
.tb{display:flex;gap:6px;padding:8px 14px;background:var(--bg)}.tb button{padding:6px 14px;border-radius:99px;font-weight:700;background:var(--c)}.tb .on{background:var(--a);color:#fff}
.sw b{display:block;font-size:12px;color:var(--m);margin:10px 0 4px}.sw i{display:inline-block;width:30px;height:30px;border-radius:8px;margin:0 6px 6px 0;border:2px solid var(--l)}
.it{background:var(--p);border-radius:12px;padding:8px;text-align:center;font-weight:700;font-size:13px}.it .e{font-size:38px;background:var(--c);border-radius:10px;padding:8px;margin-bottom:6px}.it.on{outline:2px solid var(--a)}.it small{display:block;color:var(--m)}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hb{background:var(--c);border-radius:10px;padding:8px 12px;font-weight:700;margin:0 6px 6px 0}.hb.on{background:var(--a);color:#fff}
#dr{position:fixed;inset:0;z-index:30;display:none;background:rgba(0,0,0,.55)}#dr>div{width:78%;max-width:320px;height:100%;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 18px) 14px;overflow:auto}
#dr button{display:block;width:100%;text-align:left;padding:14px 8px;font-weight:700;font-size:16px}
#ms{height:260px;overflow:auto;background:var(--p);border-radius:12px;padding:10px}#ms p{margin:0 0 8px}#ms .me{text-align:right;color:var(--a)}
#ngame{position:fixed;inset:0;display:none;z-index:20;background:#000;touch-action:none}#ngc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#nhud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:8px;align-items:center}
.gb{background:rgba(10,12,30,.6);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
#nbp{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:8px;right:8px;display:none;gap:6px;overflow-x:auto;scrollbar-width:none}#nbp .gb{flex:0 0 auto}#nbp .on{background:var(--a)}
#st{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(10,12,30,.85);color:#fff;padding:8px 16px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;z-index:50}
#njoy{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);touch-action:none}
#nkn{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:rgba(255,255,255,.7)}
#njb{position:absolute;right:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:30px;touch-action:none}
#npa{position:absolute;inset:0;display:none;background:rgba(0,0,0,.6)}#npa div{width:min(300px,80%);height:100%;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 20px) 14px}#npa button{display:block;width:100%;background:var(--c);border-radius:10px;padding:14px;margin-bottom:10px;font-weight:800}
@media (hover:hover) and (pointer:fine){#njoy,#njb{display:none}}
#game{position:fixed;inset:0;background:#000;display:none;z-index:20;touch-action:none}
#gc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#hud *{pointer-events:auto}
#ex,#inf{background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:700 14px inherit}
#inf{pointer-events:none}
#ts{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:8px 16px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#joy{position:absolute;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);touch-action:none}
#kn{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(255,255,255,.7)}
#jb{position:absolute;right:28px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;touch-action:none}
#res{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#fff;text-align:center}
#res div{background:#232730;border-radius:16px;padding:20px 26px;display:flex;flex-direction:column;gap:10px;min-width:240px}
#res h2{margin:0}#res button{border:0;border-radius:10px;padding:12px;font:800 16px inherit;background:#2f6fed;color:#fff}
@media (hover:hover) and (pointer:fine){#joy,#jb{display:none}}
#ex{display:flex;align-items:center;padding:6px 10px}
#mn{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:9;padding:12px}
.mp{width:100%;max-width:560px;background:rgba(32,34,37,.97);border-radius:14px;color:#fff;overflow:hidden}
.mt{display:flex;background:#111214}.mt button{flex:1;background:none;border:0;color:#aaa;padding:13px 4px;font:700 14px inherit}.mt .on{color:#fff;box-shadow:inset 0 -3px 0 #fff}
.mb{padding:14px;min-height:150px;max-height:40vh;overflow:auto;font-size:15px;line-height:1.7}
.pr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #3a3d40}.pr i{width:30px;height:30px;border-radius:50%;background:#F5CD30}
.msr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:10px}.msr button{background:#3a3d40;color:#fff;border:0;border-radius:8px;padding:6px 14px;font-weight:700}
.mf{display:flex;gap:8px;padding:12px;background:#111214}.mf button{flex:1;background:#393b3d;color:#fff;border:0;border-radius:8px;padding:12px 4px;font:700 13px inherit}
kbd{display:inline-block;background:#fff;color:#111;border-radius:4px;padding:0 6px;margin-right:4px;font:800 12px monospace}
#ub{position:absolute;right:132px;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:26px;display:none;align-items:center;justify-content:center;touch-action:none}

</style></head><body>
<div id="app"></div><div id="st"></div>
<div id="dr" onclick="dr(0)"><div onclick="event.stopPropagation()">
<div class="who" id="dn"></div><p class="cur" style="display:inline-block" id="dc"></p>
<button onclick="dr(0);startGame(4)">▶ Играть: Блокхейвен</button><button onclick="dr(0);tab='avatar';go()">🧍 Аватар</button><button onclick="dr(0);tab='chat';go()">💬 Друзья и чат</button><button onclick="dr(0);th()">🌗 Тема: светлая / тёмная</button><button onclick="dr(0);rs()">♻ Сбросить прогресс</button></div></div>
<div id="ngame"><canvas id="ngc"></canvas>
<div id="nhud"><button class="gb" onclick="NG.pz()">☰</button><span class="gb" id="nm"></span><span class="sp"></span><button class="gb" onclick="NG.bt()">🔨 Строить</button></div>
<div id="nbp"></div><div id="njoy"><i id="nkn"></i></div><button id="njb">▲</button>
<div id="npa"><div><button onclick="NG.pz()">▶ Продолжить</button><button onclick="NG.pz();NG.rsp()">⟲ Сбросить персонажа</button><button onclick="NG.quit()">✕ Покинуть игру</button></div></div></div>
<div id="game"><canvas id="gc"></canvas>
<div id="hud"><button id="ex" onclick="OG.menu()"><svg width="24" height="24" viewBox="0 0 32 32"><path d="M16 2 29 9v14L16 30 3 23V9z" fill="#5b7cff"/><text x="16" y="24" font-size="12" font-weight="900" text-anchor="middle" fill="#fff" font-family="system-ui">B</text></svg></button><button style="display:none">✕ Выйти</button><div id="inf"></div></div>
<div id="ts"></div><div id="joy"><i id="kn"></i></div><div id="jb">▲</div><div id="ub">🚗</div>
<div id="mn"></div><div id="res"><div><h2 id="rt"></h2><button onclick="OG.again()">Играть ещё</button><button style="background:#444" onclick="OG.quit()">В меню</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const CO=['#f5cd30','#ffd7b5','#e0ac69','#8d5524','#1e9bd7','#d94a4a','#4b974b','#8a5ad6','#2b2f3a','#f2f2f2','#5a3a22','#1b1b1f'];
let A={h:'#F3C9A5',t:'#0D69AC',l:'#2B2B2B',j:'#1B1B1B',sh:'#EDEDED',hat:0,ax:[],own:[0,1],coins:300,nick:'Vered700',theme:'',house:[],v:2};
try{Object.assign(A,JSON.parse(localStorage.getItem('bv3')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('bv3',JSON.stringify(A))}catch(e){}};
function th(){A.theme=A.theme=='dark'?'light':'dark';sv();document.documentElement.dataset.theme=A.theme}
if(A.theme)document.documentElement.dataset.theme=A.theme;
function rs(){if(confirm('Удалить все сохранения?')){try{localStorage.removeItem('bv3')}catch(e){}location.reload()}}
let GAME=0,tab='home',ct='m',tt,qs='',CHAT=[['Привет! Го в Блокхейвен?']];
function toast(m){const t=$('#st');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,1800)}
function logo(s){return`<svg width="${s}" height="${s}" viewBox="0 0 32 32"><path d="M16 2 29 9v14L16 30 3 23V9z" fill="var(--a)"/><path d="M16 2 29 9 16 16 3 9z" fill="#fff" opacity=".35"/><path d="M16 16v14L3 23V9z" fill="#000" opacity=".2"/><text x="16" y="24" font-size="12" font-weight="900" text-anchor="middle" fill="#fff" font-family="system-ui">B</text></svg>`}
function thumb(n){const s=n?['#10153a','#3a2a6b']:['#6ec6ff','#e3f6ff'],w=n?'#ffd88a':'#8fd3ff';return`<svg viewBox="0 0 160 100"><defs><linearGradient id="g${n}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s[0]}"/><stop offset="1" stop-color="${s[1]}"/></linearGradient></defs><rect width="160" height="100" fill="url(#g${n})"/><circle cx="130" cy="20" r="10" fill="${n?'#f4f1c8':'#ffe27a'}"/><rect y="70" width="160" height="30" fill="${n?'#1f4a3a':'#79c05f'}"/><rect y="78" width="160" height="12" fill="#3a3d46"/><path d="M14 70V48h30v22zM10 50 29 34 48 50z" fill="#e9d9b5"/><path d="M10 50 29 34 48 50z" fill="#b03a2e"/><rect x="20" y="54" width="8" height="8" fill="${w}"/><rect x="30" y="58" width="8" height="12" fill="#7b4a22"/><path d="M62 70V42h34v28z" fill="#e9b44c"/><path d="M58 44 79 26 100 44z" fill="#6b4a2f"/><rect x="68" y="50" width="10" height="9" fill="${w}"/><rect x="82" y="50" width="10" height="9" fill="${w}"/><rect x="118" y="52" width="5" height="18" fill="#6b4a2f"/><circle cx="120" cy="46" r="12" fill="#3f9b4a"/></svg>`}
const GM=[['Блокхейвен',4,'92%','48,2K',0],['Блокхейвен: Ночь',5,'88%','12,7K',1],['Obby: Башня',0,'94%','3,4K','o'],['Остров монет',1,'91%','1,9K','c'],['Лава поднимается',2,'96%','5,2K','l'],['Городок RP',3,'97%','8,1K',2]];
function thumbX(k){const T={o:['#ff7a45','#ec4899','<rect x="8" y="78" width="36" height="8" rx="2" fill="#22c55e"/><rect x="52" y="64" width="30" height="8" rx="2" fill="#3b82f6"/><rect x="90" y="50" width="28" height="8" rx="2" fill="#a855f7"/><rect x="124" y="34" width="28" height="8" rx="2" fill="#facc15"/><rect x="60" y="48" width="8" height="16" fill="#F5CD30"/>'],c:['#22c55e','#06b6d4','<ellipse cx="80" cy="84" rx="62" ry="12" fill="#4ade80"/><circle cx="50" cy="60" r="9" fill="#fbbf24"/><circle cx="82" cy="50" r="9" fill="#fbbf24"/><circle cx="112" cy="64" r="9" fill="#fbbf24"/><rect x="28" y="66" width="5" height="18" fill="#8b5a2b"/><circle cx="30" cy="60" r="12" fill="#15803d"/>'],l:['#7f1d1d','#f97316','<path d="M0 78Q20 68 40 78T80 78T120 78T160 78V100H0z" fill="#ff5a1f"/><rect x="50" y="56" width="26" height="7" fill="#f87171"/><rect x="84" y="38" width="26" height="7" fill="#fbbf24"/><rect x="116" y="20" width="26" height="7" fill="#34d399"/>'],t:['#38bdf8','#22c55e','<rect y="66" width="160" height="34" fill="#4ade80"/><rect y="74" width="160" height="12" fill="#3b3f46"/><rect x="20" y="40" width="34" height="26" fill="#fde68a"/><path d="M16 42 37 24 58 42z" fill="#8b3a2b"/><rect x="100" y="44" width="34" height="22" fill="#a5b4fc"/><path d="M96 46 117 30 138 46z" fill="#8b3a2b"/><rect x="66" y="78" width="26" height="9" rx="3" fill="#ef4444"/>']}[k];return`<svg viewBox="0 0 160 100"><defs><linearGradient id="x${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T[0]}"/><stop offset="1" stop-color="${T[1]}"/></linearGradient></defs><rect width="160" height="100" fill="url(#x${k})"/>${T[2]}</svg>`}
function gth(k){return k===2?thumbX('t'):typeof k=='number'?thumb(k):thumbX(k)}
function tile(g){return`<button class="gt" onclick="startGame(${g[1]})">${gth(g[4])}<b>${g[0]}</b><small>👍 ${g[2]} · 👤 ${g[3]}</small></button>`}
function head(){return`<header class="hd"><button class="ib" onclick="dr(1)">☰</button><span class="lg">${logo(26)}BLOCKVERSE</span><span class="sp"></span><button class="ib" onclick="tab='charts';go()">🔍</button><span class="cur" id="cur">◈ ${A.coins}</span><button class="ib" onclick="toast('Новых уведомлений: 4')">🔔<i class="bd">4</i></button></header>`}
function nav(){return`<nav class="nv">${[['home','🏠','Главная'],['charts','📊','Рейтинги'],['avatar','🧍','Аватар'],['chat','💬','Чат']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';go()"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`}
function dr(o){$('#dr').style.display=o?'block':'none';$('#dn').textContent=A.nick;$('#dc').textContent='◈ '+A.coins}
function go(){GAME=0;cancelAnimationFrame(praf);scrollTo(0,0);
if(tab=='home'){app.innerHTML=head()+`<main><div class="who">${logo(34)}${A.nick}</div><div class="fr"><div class="f"><div class="fc" onclick="toast('Поиск друзей скоро')">＋</div>Добавить</div>${[['dhhe3733','Играет в Блокхейвен'],['H0lygAn','Играет'],['sanya','В сети'],['Mika','В сети']].map((f,i)=>`<div class="f" onclick="tab='chat';go()"><div class="fc" style="background:${CO[[5,7,6,2][i]]}">${f[0][0].toUpperCase()}<i></i></div>${f[0]}<small>${f[1]}</small></div>`).join('')}</div><h3>Рекомендуем для тебя</h3><div class="gd">${GM.map(tile).join('')}</div></main>`+nav()}
else if(tab=='charts'){app.innerHTML=head()+`<main><input class="sr" placeholder="🔍 Поиск игр" value="${qs}" oninput="qs=this.value;cl()"><div id="cl"></div><h3>Мультиплеер</h3><small style="color:var(--m)">Адрес сервера (wss://…) и ник</small><input class="sr" placeholder="wss://твой-сервер.onrender.com" value="${OG.srv()}" oninput="OG.saveSrv(this.value)" onchange="OG.setSrv(this.value)"><input class="sr" placeholder="Ник" value="${A.nick}" maxlength="16" onchange="A.nick=this.value.slice(0,16)||A.nick;sv()"><button class="hb" onclick="OG.testSrv()">🔎 Проверить сервер</button><small id="sst" style="display:block;color:var(--m);margin-top:8px"></small></main>`+nav();cl()}
else if(tab=='chat'){app.innerHTML=head()+`<main><h3>dhhe3733</h3><div id="ms"></div><input class="sr" id="ci" placeholder="Сообщение…" onkeydown="if(event.key=='Enter')snd()"><button class="hb on" onclick="snd()">Отправить</button></main>`+nav();msg()}
else{app.innerHTML=head()+`<div id="pv"></div><div class="tb"><button class="${ct=='m'?'on':''}" onclick="ct='m';pn()">Маркетплейс</button><button class="${ct=='c'?'on':''}" onclick="ct='c';pn()">Кастомизация</button></div><main id="pn"></main>`+nav();mountPv();pn()}}
