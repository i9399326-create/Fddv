<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<title>Blockverse Online</title>
<style>
:root{--bg:#eef0f6;--panel:#fff;--text:#14171f;--muted:#5c6477;--line:#d9dde8;--acc:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#15171c;--panel:#232730;--text:#f2f4f8;--muted:#9aa3b5;--line:#343a47;--acc:#4d8dff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-y:auto;-webkit-user-select:none;user-select:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.lg{width:24px;height:24px;background:var(--acc);border-radius:6px;transform:rotate(-12deg);display:block}
.top b{letter-spacing:1px}.sp{flex:1}.cn{font-weight:800}
main{max-width:720px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:14px}
h2{margin:0 0 8px;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.avr{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.pv{position:relative;display:flex;flex-direction:column;align-items:center;width:100px;padding-top:26px}
.pv div{border-radius:4px}.hd{width:40px;height:40px;text-align:center;font:700 14px/40px monospace;color:#111}
.rw{display:flex;gap:3px}.ar{width:14px;height:46px}.tr{width:46px;height:46px}.lq{width:22px;height:44px}
.ht{position:absolute;top:0;font-size:30px;line-height:1}
.sw{margin:0 0 8px}.sw b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.sw i{display:inline-block;width:26px;height:26px;border-radius:6px;margin:0 4px 4px 0;border:2px solid var(--line);cursor:pointer}
.hb{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:6px 8px;font:600 12px inherit;margin:0 4px 4px 0;cursor:pointer}
.hb.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.gs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gm{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.gm .th{height:110px;display:flex;align-items:center;justify-content:center;font-size:54px}
.gm div:last-child{padding:8px 10px}.gm small{color:var(--muted)}

#ex,#inf{background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:700 14px inherit}

#ts{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:8px 16px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#joy{position:absolute;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);touch-action:none}
#kn{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(255,255,255,.7)}

#res{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#fff;text-align:center}

#res h2{margin:0}#res button{border:0;border-radius:10px;padding:12px;font:800 16px inherit;background:#2f6fed;color:#fff}

#home{padding-bottom:76px}
.rt{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}.rt b{letter-spacing:1px}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0;font:700 11px inherit;display:flex;flex-direction:column;align-items:center;gap:2px}.bn button b{font-size:22px}.bn .on{color:var(--text)}
main h3{margin:8px 0 6px;font-size:17px}.rh{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tl{flex:0 0 140px;cursor:pointer}.tt{height:140px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:6px}.tl b{display:block;font-size:14px}.tl small{color:var(--muted)}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}.gr .tl{flex:none}
.hi{display:flex;align-items:center;gap:12px;margin:4px 0 10px}.hi i{width:56px;height:56px;border-radius:50%;background:#F5CD30;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:28px}
.pvw{height:330px;border-radius:14px;background:radial-gradient(circle at 50% 30%,#4a4f57,#232527);touch-action:none;cursor:grab;overflow:hidden}
.srch{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:15px inherit;margin-bottom:10px;user-select:text;-webkit-user-select:text}
#ex{display:flex;align-items:center;padding:6px 10px}
#mn{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:9;padding:12px}
.mp{width:100%;max-width:560px;background:rgba(32,34,37,.97);border-radius:14px;color:#fff;overflow:hidden}
.mt{display:flex;background:#111214}.mt button{flex:1;background:none;border:0;color:#aaa;padding:13px 4px;font:700 14px inherit}.mt .on{color:#fff;box-shadow:inset 0 -3px 0 #fff}
.mb{padding:14px;min-height:150px;max-height:40vh;overflow:auto;font-size:15px;line-height:1.7}
.pr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #3a3d40}.pr i{width:30px;height:30px;border-radius:50%;background:#F5CD30}
.sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:10px}.sr button{background:#3a3d40;color:#fff;border:0;border-radius:8px;padding:6px 14px;font-weight:700}
.mf{display:flex;gap:8px;padding:12px;background:#111214}.mf button{flex:1;background:#393b3d;color:#fff;border:0;border-radius:8px;padding:12px 4px;font:700 13px inherit}
kbd{display:inline-block;background:#fff;color:#111;border-radius:4px;padding:0 6px;margin-right:4px;font:800 12px monospace}
</style></head><body>
<div id="home">
<div class="top"><i class="lg"></i><b>BLOCKVERSE</b><span class="sp"></span><span class="cn">🟢 <b id="cn">0</b></span></div>
<main><section class="card"><h2>Твой аватар</h2><div class="avr" id="av"></div></section>
<section><h2>Игры</h2><div class="gs" id="gs"></div></section>
<small style="color:var(--muted)">Кнопки управления: джойстик слева, прыжок справа, камера — свайп по экрану. На ПК: WASD, пробел и мышь.</small></main></div>
<div id="game"><canvas id="gc"></canvas>
<div id="hud"><button id="ex" onclick="menu()"><i class="lg"></i></button><button style="display:none">✕ Выйти</button><div id="inf"></div></div>
<div id="ts"></div><div id="joy"><i id="kn"></i></div><div id="jb">▲</div>
<div id="mn"></div><div id="res"><div><h2 id="rt"></h2><button onclick="again()">Играть ещё</button><button style="background:#444" onclick="quit()">В меню</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let A={h:'#f5cd30',t:'#2f6fed',l:'#3ba55d',hat:0,own:[0,1],coins:0};
try{Object.assign(A,JSON.parse(localStorage.getItem('bv')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('bv',JSON.stringify(A))}catch(e){}};
const COL=['#f5cd30','#ff6b6b','#2f6fed','#3ba55d','#a855f7','#fb923c','#f472b6','#e5e7eb','#374151','#8d5524'];
const HATS=[['Без шапки',0,''],['Кепка',0,'🧢'],['Цилиндр',100,'🎩'],['Корона',300,'👑'],['Нимб',500,'😇']];
const GM=[['Obby: Башня','🧱','linear-gradient(135deg,#ff7a45,#ec4899)',3412,'Прыгай по платформам, чекпоинты каждые 10 блоков'],['Остров монет','🪙','linear-gradient(135deg,#22c55e,#06b6d4)',1876,'60 секунд, собери все монеты'],['Лава поднимается','🌋','linear-gradient(135deg,#f97316,#7f1d1d)',5204,'Лезь вверх, пока лава не догнала']];
function home(){$('#cn').textContent=A.coins;
const sw=(k,n)=>`<div class="sw"><b>${n}</b>${COL.map(c=>`<i style="background:${c}" onclick="setC('${k}','${c}')"></i>`).join('')}</div>`;
$('#av').innerHTML=`<div class="pv"><span class="ht">${HATS[A.hat][2]}</span><div class="hd" style="background:${A.h}">:)</div><div class="rw"><div class="ar" style="background:${A.h}"></div><div class="tr" style="background:${A.t}"></div><div class="ar" style="background:${A.h}"></div></div><div class="rw"><div class="lq" style="background:${A.l}"></div><div class="lq" style="background:${A.l}"></div></div></div>
<div style="flex:1;min-width:180px">${sw('h','Голова и руки')}${sw('t','Торс')}${sw('l','Ноги')}<div class="sw"><b>Шапки</b>${HATS.map((h,i)=>`<button class="hb ${A.hat==i?'on':''}" onclick="hat(${i})">${h[2]||'—'} ${h[0]}<br>${A.own.includes(i)?'есть':'🟢 '+h[1]}</button>`).join('')}</div></div>`;
$('#gs').innerHTML=GM.map((g,i)=>`<div class="gm" onclick="launch(${i})"><div class="th" style="background:${g[2]}">${g[1]}</div><div><b>${g[0]}</b><br><small>▶ ${g[3].toLocaleString('ru-RU')} играют</small><br><small>${g[4]}</small></div></div>`).join('')}
function setC(k,c){A[k]=c;sv();home()}
function hat(i){if(!A.own.includes(i)){if(A.coins<HATS[i][1])return;A.coins-=HATS[i][1];A.own.push(i)}A.hat=i;sv();home()}
let R,SC,CAM,PL,P,G,BX,SUN,ON=0,raf,last=0,yaw=0,pitch=.4,jump=0,keys={},ji={x:0,y:0},cur=0,tt;
const K={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'w',ArrowLeft:'a',ArrowDown:'s',ArrowRight:'d',Space:' '};
addEventListener('keydown',e=>{if(ON){if(e.code=='Escape')menu();else if(G.paused&&e.code=='KeyR')resetC();else if(G.paused&&e.code=='KeyL')quit()}if(K[e.code]){keys[K[e.code]]=1;if(ON)e.preventDefault()}});
addEventListener('keyup',e=>{if(K[e.code])keys[K[e.code]]=0});
const gc=$('#gc'),ptr={};
gc.onpointerdown=e=>{ptr[e.pointerId]=[e.clientX,e.clientY];gc.setPointerCapture(e.pointerId)};
gc.onpointermove=e=>{const p=ptr[e.pointerId];if(!p)return;yaw-=(e.clientX-p[0])*.006*SET.s;pitch=Math.max(.05,Math.min(1.25,pitch+(e.clientY-p[1])*.005));p[0]=e.clientX;p[1]=e.clientY};
gc.onpointerup=gc.onpointercancel=e=>{delete ptr[e.pointerId]};
const joy=$('#joy'),kn=$('#kn');let jp=null;
function jm(e){const r=joy.getBoundingClientRect(),m=r.width/2;let dx=e.clientX-r.left-m,dy=e.clientY-r.top-m;const l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}ji.x=dx/m;ji.y=-dy/m;kn.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{jp=e.pointerId;joy.setPointerCapture(jp);jm(e)};
joy.onpointermove=e=>{if(e.pointerId==jp)jm(e)};
joy.onpointerup=joy.onpointercancel=()=>{jp=null;ji.x=ji.y=0;kn.style.transform=''};
$('#jb').onpointerdown=()=>jump=1;$('#jb').onpointerup=$('#jb').onpointercancel=()=>jump=0;
function toast(m){const t=$('#ts');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2000)}
const M=c=>new THREE.MeshLambertMaterial({color:c});
function mkChar(a){const g=new THREE.Group();
const part=(w,h,d,c,x,y,z,pv)=>{const gr=new THREE.Group();gr.position.set(x,y,z);const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.y=pv?-h/2:0;m.castShadow=true;gr.add(m);g.add(gr);return gr};
const lg=[part(.75,1.5,.9,a.l,-.4,1.5,0,1),part(.75,1.5,.9,a.l,.4,1.5,0,1)];
part(1.6,1.5,.9,a.t,0,2.25,0);
const ar=[part(.6,1.5,.7,a.h,-1.1,3,0,1),part(.6,1.5,.7,a.h,1.1,3,0,1)];
const hd=part(1.1,1.1,1.1,a.h,0,3.55,0);
const ad=(geo,c,x,y,z)=>{const m=new THREE.Mesh(geo,M(c));m.position.set(x,y,z);hd.add(m);return m};
ad(new THREE.BoxGeometry(.15,.22,.05),'#111',-.25,.1,.56);ad(new THREE.BoxGeometry(.15,.22,.05),'#111',.25,.1,.56);ad(new THREE.BoxGeometry(.5,.08,.05),'#111',0,-.25,.56);
const h=a.hat;
if(h==1){ad(new THREE.BoxGeometry(1.2,.35,1.2),'#ef4444',0,.7,0);ad(new THREE.BoxGeometry(1.2,.1,.6),'#b91c1c',0,.55,.8)}
if(h==2){ad(new THREE.CylinderGeometry(.55,.55,.9,16),'#111',0,1,0);ad(new THREE.CylinderGeometry(.85,.85,.1,16),'#111',0,.58,0)}
if(h==3)ad(new THREE.ConeGeometry(.7,.7,5),'#facc15',0,.9,0);
if(h==4){const m=ad(new THREE.TorusGeometry(.6,.07,8,24),'#fde047',0,1.1,0);m.rotation.x=Math.PI/2;m.material=new THREE.MeshBasicMaterial({color:'#fde047'})}
return{g,lg,ar,ph:0}}
function bb(b){const p=b.m.position;b.x0=p.x-b.w/2;b.x1=p.x+b.w/2;b.y0=p.y-b.h/2;b.y1=p.y+b.h/2;b.z0=p.z-b.d/2;b.z1=p.z+b.d/2}
function bx(x,y,z,w,h,d,c,o={}){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;SC.add(m);const b=Object.assign({m,w,h,d},o);bb(b);BX.push(b);return b}
function plane(c,y,basic){const m=new THREE.Mesh(new THREE.PlaneGeometry(800,800),basic?new THREE.MeshBasicMaterial({color:c}):M(c));m.rotation.x=-Math.PI/2;m.position.y=y;SC.add(m);return m}
function la(a,b,t){const d=((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;return a+d*t}
function obby(){G.sp={x:0,y:.5,z:0};G.fall=-40;G.st=0;bx(0,-.5,0,16,1,16,'#94a3b8',{cp:1});
const cols=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899'];let y=0,z=0;
for(let i=1;i<=42;i++){z-=11+Math.random()*2;if(i%4==0)y+=1.5;const c=cols[i%6],yy=y-.5,zz=z;
if(i%10==0)bx(0,yy,zz,14,1,14,'#22c55e',{cp:1,st:i/10});
else if(i%3==0){const ph=Math.random()*6;bx(0,yy,zz,7,1,7,c,{mv:(b,t)=>{b.m.position.x=Math.sin(t*1.2+ph)*9}})}
else bx((Math.random()-.5)*10,yy,zz,7,1,7,c)}
bx(0,y-.5,z-14,18,1,18,'#facc15',{win:1,cp:1});plane('#7dd3fc',-35);
G.info=()=>`Этап ${G.st} · ${Math.max(0,Math.floor(-P.z))} м`}
function coinsG(){G.sp={x:0,y:.5,z:0};G.fall=-12;G.time=60;G.n=0;G.cs=[];bx(0,-1,0,140,2,140,'#4ade80');plane('#2b8cff',-3);
const pyr=(x,z)=>{for(let i=0;i<5;i++)bx(x,i*1.5+.75,z,20-i*4,1.5,20-i*4,'#b0b7c3')};pyr(40,-30);pyr(-38,35);
for(let i=0;i<28;i++){const x=(Math.random()-.5)*130,z=(Math.random()-.5)*130;if(Math.hypot(x,z)<8)continue;const t=new THREE.Mesh(new THREE.CylinderGeometry(.6,.8,4,8),M('#8b5a2b'));t.position.set(x,2,z);t.castShadow=true;const l=new THREE.Mesh(new THREE.SphereGeometry(3,8,6),M('#15803d'));l.position.set(x,6,z);l.castShadow=true;SC.add(t,l)}
const cm=new THREE.MeshLambertMaterial({color:'#fbbf24',emissive:'#a16207'});
const mc=(x,y,z)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.3,16),cm);m.rotation.z=Math.PI/2;m.position.set(x,y,z);SC.add(m);G.cs.push(m)};
for(let i=0;i<34;i++)mc((Math.random()-.5)*120,2,(Math.random()-.5)*120);[[40,-30],[-38,35]].forEach(p=>mc(p[0],10.5,p[1]));
G.bots=[0,1,2].map(i=>{const c=mkChar({h:COL[(i*3+1)%10],t:COL[(i*3+4)%10],l:COL[(i*3+2)%10],hat:i});c.g.position.set((i-1)*12,0,-14);c.tx=0;c.tz=0;SC.add(c.g);return c});
G.upd=dt=>{G.time-=dt;G.cs.forEach((m,i)=>{if(!m.visible)return;m.rotation.y+=dt*3;m.position.y+=Math.sin(G.t*3+i)*.01;if(Math.hypot(m.position.x-P.x,m.position.z-P.z)<2.6&&Math.abs(m.position.y-P.y-2)<4.5){m.visible=false;G.n++}});
G.bots.forEach(b=>{if(Math.hypot(b.tx-b.g.position.x,b.tz-b.g.position.z)<2){b.tx=(Math.random()-.5)*110;b.tz=(Math.random()-.5)*110}const dx=b.tx-b.g.position.x,dz=b.tz-b.g.position.z,l=Math.hypot(dx,dz);b.g.position.x+=dx/l*9*dt;b.g.position.z+=dz/l*9*dt;b.g.rotation.y=la(b.g.rotation.y,Math.atan2(dx,dz),.15);b.ph+=dt*10;const s=Math.sin(b.ph)*.8;b.lg[0].rotation.x=s;b.lg[1].rotation.x=-s;b.ar[0].rotation.x=-s;b.ar[1].rotation.x=s});
if(G.time<=0)fin(`⏱ Время вышло! Собрано монет: ${G.n}`,G.n)};
G.info=()=>`⏱ ${Math.max(0,Math.ceil(G.time))} · 🪙 ${G.n}/36`}
function lavaG(){G.sp={x:0,y:.5,z:0};G.fall=-999;G.ly=-3;bx(0,-.5,0,18,1,18,'#94a3b8');
const lc=['#f87171','#fbbf24','#34d399','#60a5fa','#c084fc'];
for(let i=1;i<=70;i++){const a=i*.85,r=12+(i%3)*4;bx(Math.cos(a)*r,i*3.2-.5,Math.sin(a)*r,8,1,8,lc[i%5])}
G.lm=plane('#ff5a1f',G.ly,1);
G.upd=dt=>{G.ly+=(1.4+G.t*.025)*dt;G.lm.position.y=G.ly;if(P.y<G.ly-.3){const s=Math.floor(G.t);fin(`🌋 Лава догнала! Ты продержался ${s} с`,Math.floor(s/3))}};
G.info=()=>`🌋 ${Math.floor(G.t)} с · высота ${Math.max(0,Math.floor(P.y))}`}
function fin(t,r){if(G.over)return;G.over=1;A.coins+=r||0;sv();$('#rt').textContent=t+(r?` (+${r} 🟢)`:'');$('#res').style.display='flex'}
function launch(i){cur=i;A.last=i;sv();ON=1;$('#mn').style.display='none';$('#game').style.display='block';$('#res').style.display='none';$('#home').style.display='none';
